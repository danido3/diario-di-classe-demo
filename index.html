<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8f5">
<title>Diario di classe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#f7f8f5;color:#1c2b26;font:16px 'DM Sans',system-ui,sans-serif}h1,h2,h3,p{margin:0}h1,h2,.brand{font-family:Manrope,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:.65rem .85rem;background:#edf2ee;color:#244438;font-weight:700}button:hover{filter:brightness(.95)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #419b76;outline-offset:2px}header{background:white;border-bottom:1px solid #e1e7e0}.bar,main{width:min(100% - 32px,1080px);margin:auto}.bar{display:flex;align-items:center;justify-content:space-between;min-height:72px;gap:12px}.brand{font-weight:800;display:flex;align-items:center;gap:10px}.mark{background:#174b39;color:white;border-radius:12px;padding:8px 11px}.primary{background:#174b39;color:white}nav{display:flex;gap:5px;overflow:auto;padding:12px 0}nav button{white-space:nowrap;background:white}nav button[aria-current=page]{background:#dceee3}main{padding-bottom:36px}.hero{background:#163f34;color:white;padding:clamp(24px,5vw,52px);border-radius:24px;margin:12px 0 24px;position:relative;overflow:hidden;background-image:radial-gradient(ellipse at 96% 4%,#327b5a,transparent 55%)}.hero p{color:#d9eee1;margin-top:10px}.hero .eyebrow{margin:0 0 10px;text-transform:uppercase;letter-spacing:.12em;font-size:.75rem;font-weight:700}.hero h1{font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.045em}.columns{display:grid;gap:16px}.panel{background:white;border:1px solid #e0e7e0;border-radius:19px;padding:18px;min-width:0}.panel h2{font-size:1.2rem;margin-bottom:12px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 20px}.page-head h1{font-size:clamp(1.5rem,4vw,2.35rem)}.muted,small{color:#53675e}.row{padding:13px 0;border-top:1px solid #edf0eb;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.row:first-of-type{border-top:0}.row>div:first-child{min-width:0;overflow-wrap:anywhere}.row p{margin-top:4px;white-space:pre-wrap}.actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.actions button{font-size:.8rem;padding:.45rem .55rem}.badge{display:inline-block;border-radius:30px;background:#e6f1fa;color:#234e68;padding:3px 8px;font-weight:700;font-size:.75rem;margin-bottom:4px}.warn{background:#ffefd0;color:#734400}.late{background:#fbe2df;color:#8b2724}.done{opacity:.72}.done strong{text-decoration:line-through}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.calendar button{min-width:0;padding:6px 0;min-height:42px;background:#f1f5f0}.calendar [aria-pressed=true]{background:#174b39;color:white}.calendar .today{box-shadow:inset 0 0 0 2px #4d9c76}.dot{display:block;font-size:.65rem;min-height:11px;line-height:11px}.month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;text-transform:capitalize}.month h2{margin:0}.calendar+section{margin-top:22px}.week{display:grid;gap:12px}.day{padding:14px;border:1px solid #e0e7e0;border-radius:16px;background:white}.day h2{font-size:1.05rem;margin-bottom:9px}.day.current{border-color:#49916f}.future{margin-top:24px;padding:13px 0;border-top:1px solid #dfe7df;font-size:.88rem;color:#53675e}dialog{width:min(92%,470px);max-height:90dvh;border:0;border-radius:19px;padding:22px;color:inherit;box-shadow:0 24px 80px #132c3250}dialog::backdrop{background:#102a2580}form{display:grid;gap:12px;margin-top:14px}label{display:grid;gap:4px;font-weight:700}input,select,textarea{width:100%;min-width:0;border:1px solid #b9c8bf;border-radius:9px;padding:9px;background:white;color:inherit}textarea{resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px}.status{color:#8b2724;margin-top:8px}.status:empty{display:none}@media(min-width:720px){.columns{grid-template-columns:1.2fr 1fr}.week{grid-template-columns:repeat(3,1fr)}.panel{padding:22px}}@media(max-width:420px){.row{flex-wrap:wrap}.actions{justify-content:flex-start}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand"><span class="mark" aria-hidden="true">▤</span> Diario di classe</div><button type="button" class="primary" data-add="default">＋ Aggiungi</button></div></header>
<main><nav aria-label="Sezioni"></nav><p class="status" role="status" id="storageStatus"></p><div id="view"></div><footer class="future">In sviluppo · Assistente AI e condivisione tra studenti</footer></main>
<dialog aria-labelledby="dialogTitle"><h2 id="dialogTitle"></h2><form id="editor"></form></dialog>
<script>
'use strict';
const views = {home:'Home',task:'Compiti',exam:'Verifiche',calendar:'Calendario',lesson:'Orario'};
const days = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const types = {task:'Compito',exam:'Verifica o interrogazione',event:'Evento scolastico',lesson:'Lezione'};
const storageKey = 'diario-di-classe-v1';
const nav = document.querySelector('nav');
const view = document.querySelector('#view');
const dialog = document.querySelector('dialog');
const form = document.querySelector('#editor');
const storageStatus = document.querySelector('#storageStatus');
const fullDate = new Intl.DateTimeFormat('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const shortDate = new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'short'});
const monthFormat = new Intl.DateTimeFormat('it-IT',{month:'long',year:'numeric'});
function dateKey(date) {
  return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
}
function dateFromKey(key) { return new Date(key + 'T12:00:00'); }
function offsetDate(daysAhead) {
  const date = new Date();
  date.setDate(date.getDate()+daysAhead);
  return dateKey(date);
}
function demo() {
  const sample = [
    {type:'task',title:'Ripassare le equazioni',subject:'Matematica',date:offsetDate(0),notes:'Esercizi 12–16 a pagina 84.'},
    {type:'task',title:'Consegnare la relazione di laboratorio',subject:'Tecnologie',date:offsetDate(2),notes:''},
    {type:'exam',kind:'Verifica',title:'Circuiti in corrente continua',subject:'Elettrotecnica',date:offsetDate(1),notes:''},
    {type:'exam',kind:'Interrogazione',title:'Il Romanticismo',subject:'Italiano',date:offsetDate(5),notes:''},
    {type:'event',title:'Assemblea di classe',date:offsetDate(7),notes:''}
  ];
  const subjects = ['Matematica','Italiano','Elettrotecnica','Inglese','Tecnologie','Storia'];
  days.forEach((day,index) => {
    sample.push({type:'lesson',title:subjects[index],weekday:index,start:'08:00',end:'09:00',notes:'',room:'Aula 4'});
    sample.push({type:'lesson',title:subjects[(index+2)%subjects.length],weekday:index,start:'09:00',end:'10:00',notes:'',room:'Aula 4'});
  });
  return sample.map((item,index) => ({...item,id:'demo-'+index,done:false}));
}
function loadEntries() {
  try {
    const saved = localStorage.getItem(storageKey);
    if (saved !== null) {
      const parsed = JSON.parse(saved);
      if (!Array.isArray(parsed)) throw new Error('Archivio non valido');
      return parsed;
    }
    const initial = demo();
    localStorage.setItem(storageKey,JSON.stringify(initial));
    return initial;
  } catch {
    storageStatus.textContent = 'Archivio locale non disponibile. Le modifiche potrebbero perdersi alla chiusura.';
    return demo();
  }
}
let entries = loadEntries();
let page = 'home';
let selected = dateKey(new Date());
let month = dateFromKey(selected);
let editingId = null;
function save(next) {
  entries = next;
  try {
    localStorage.setItem(storageKey,JSON.stringify(entries));
    storageStatus.textContent = '';
  } catch {
    storageStatus.textContent = 'Il browser non ha salvato le modifiche. Rimangono disponibili finché questa pagina è aperta.';
  }
  render();
}
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[character]);
}
function sorted(filter) {
  return entries.filter(filter).sort((a,b) => (a.date || a.start).localeCompare(b.date || b.start));
}
function reminder(item) {
  if (!item.date || item.done) return '';
  if (item.date < offsetDate(0)) return '<span class="badge late">Scaduto</span>';
  if (item.date === offsetDate(0)) return '<span class="badge warn">Oggi</span>';
  if (item.date === offsetDate(1)) return '<span class="badge warn">Domani</span>';
  return '';
}
function row(item) {
  const id = escapeHtml(item.id);
  const detail = item.type === 'lesson'
    ? [item.start+'–'+item.end,item.room]
    : [item.type === 'exam' ? item.kind : types[item.type],item.subject,shortDate.format(dateFromKey(item.date))];
  return '<article class="row'+(item.done?' done':'')+'"><div>'+reminder(item)+'<div><strong>'+escapeHtml(item.title)+'</strong></div><small>'+
    escapeHtml(detail.filter(Boolean).join(' · '))+'</small>'+(item.notes?'<p>'+escapeHtml(item.notes)+'</p>':'')+'</div><div class="actions">'+
    (item.type==='task'?'<button type="button" data-toggle="'+id+'" aria-pressed="'+Boolean(item.done)+'">'+(item.done?'Riapri':'Completa')+'</button>':'')+
    '<button type="button" data-edit="'+id+'">Modifica</button><button type="button" data-delete="'+id+'">Elimina</button></div></article>';
}
function rows(list,empty) {
  return list.length ? list.map(row).join('') : '<p class="muted">'+empty+'</p>';
}
function heading(title,type,label) {
  return '<div class="page-head"><h1>'+title+'</h1><button type="button" class="primary" data-add="'+type+'">＋ '+label+'</button></div>';
}
function renderHome() {
  const today = new Date();
  const upcoming = sorted(item => item.type!=='lesson' && !item.done && (item.date>=offsetDate(0)||item.type==='task'));
  view.innerHTML = '<section class="hero"><p class="eyebrow">'+fullDate.format(today)+'</p><h1>La tua giornata a scuola</h1><p>Scadenze e orario della classe, a colpo d’occhio.</p></section><div class="columns">'+
    '<section class="panel"><h2>Scadenze</h2>'+rows(upcoming,'Non ci sono scadenze da ricordare.')+'</section>'+
    '<section class="panel"><h2>Lezioni di oggi</h2>'+rows(sorted(item=>item.type==='lesson' && item.weekday===today.getDay()-1),'Nessuna lezione in orario oggi.')+'</section></div>';
}
function renderCalendar() {
  const year = month.getFullYear();
  const index = month.getMonth();
  const blanks = (new Date(year,index,1).getDay()+6)%7;
  const count = new Date(year,index+1,0).getDate();
  const dated = sorted(item=>item.type!=='lesson');
  let grid = days.concat('Domenica').map(day=>'<small aria-label="'+day+'">'+day.slice(0,3)+'</small>').join('')+'<span></span>'.repeat(blanks);
  for(let day=1;day<=count;day++) {
    const date = new Date(year,index,day);
    const key = dateKey(date);
    const total = dated.filter(item=>item.date===key).length;
    grid += '<button type="button" class="'+(key===offsetDate(0)?'today':'')+'" aria-pressed="'+(key===selected)+'" data-date="'+key+'" aria-label="'+fullDate.format(date)+', elementi: '+total+'">'+day+'<span class="dot" aria-hidden="true">'+(total?'●':'')+'</span></button>';
  }
  view.innerHTML = heading('Calendario','event','Evento')+'<section class="panel"><div class="month"><button type="button" data-month="-1" aria-label="Mese precedente">‹</button><h2>'+
    monthFormat.format(month)+'</h2><button type="button" data-month="1" aria-label="Mese successivo">›</button></div><div class="calendar">'+grid+
    '</div><section><h2>'+fullDate.format(dateFromKey(selected))+'</h2>'+rows(dated.filter(item=>item.date===selected),'Nessun elemento in questa data.')+'</section></section>';
}
function render() {
  nav.innerHTML = Object.entries(views).map(([key,label])=>'<button type="button" data-page="'+key+'"'+(key===page?' aria-current="page"':'')+'>'+label+'</button>').join('');
  switch(page) {
    case 'home': renderHome(); break;
    case 'calendar': renderCalendar(); break;
    case 'lesson':
      view.innerHTML = heading('Orario settimanale','lesson','Lezione')+'<div class="week">'+days.map((day,index)=>'<section class="day'+(index===new Date().getDay()-1?' current':'')+'"><h2>'+day+'</h2>'+
        rows(sorted(item=>item.type==='lesson' && item.weekday===index),'Nessuna lezione.')+'</section>').join('')+'</div>';
      break;
    case 'task':
      view.innerHTML = heading('Compiti','task','Compito')+'<section class="panel">'+rows(sorted(item=>item.type==='task').sort((a,b)=>Number(a.done)-Number(b.done)),'Nessun compito.')+'</section>';
      break;
    case 'exam':
      view.innerHTML = heading('Verifiche e interrogazioni','exam','Aggiungi')+'<section class="panel">'+rows(sorted(item=>item.type==='exam'),'Nessuna verifica o interrogazione.')+'</section>';
      break;
  }
}
function field(label,name,value,type='text',required=false) {
  return '<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+escapeHtml(value)+'" '+(required?'required':'')+'></label>';
}
function options(list,value) {
  return list.map(([key,label])=>'<option value="'+key+'" '+(String(key)===String(value)?'selected':'')+'>'+label+'</option>').join('');
}
function editor(type,item={},chooseType=false) {
  document.querySelector('#dialogTitle').textContent = editingId ? 'Modifica · '+types[type] : 'Nuovo elemento';
  form.dataset.type = type;
  form.innerHTML = (chooseType?'<label>Tipo<select name="type">'+options(Object.entries(types),type)+'</select></label>':'')+
    (type==='exam'?'<label>Modalità<select name="kind">'+options([['Verifica','Verifica'],['Interrogazione','Interrogazione']],item.kind)+'</select></label>':'')+
    field(type==='lesson'?'Materia':'Titolo','title',item.title,'text',true)+
    (type==='task'||type==='exam'?field('Materia','subject',item.subject):'')+
    (type==='lesson'?'<label>Giorno<select name="weekday">'+options(days.map((day,index)=>[index,day]),item.weekday)+'</select></label>'+
    field('Inizio','start',item.start,'time',true)+field('Fine','end',item.end,'time',true)+field('Aula','room',item.room):
    field('Data','date',item.date || (page==='calendar'?selected:offsetDate(0)),'date',true))+
    '<label>Note<textarea name="notes" rows="2">'+escapeHtml(item.notes)+'</textarea></label><div class="form-actions"><button type="button" data-close>Annulla</button><button class="primary">Salva</button></div>';
}
form.addEventListener('change',event=>{
  if(event.target.name==='type') {
    const draft = Object.fromEntries(new FormData(form));
    editor(draft.type,draft,true);
    form.elements.type.focus();
  }
});
form.addEventListener('input',()=> {
  form.elements.end?.setCustomValidity('');
  form.elements.title.setCustomValidity('');
});
form.addEventListener('submit',event=>{
  event.preventDefault();
  const item = Object.fromEntries(new FormData(form));
  item.type = form.dataset.type;
  item.title = item.title.trim();
  if(!item.title) {
    form.elements.title.setCustomValidity('Inserisci un titolo.');
    form.elements.title.reportValidity();
    return;
  }
  if(item.type==='lesson') {
    item.weekday = Number(item.weekday);
    if(item.end<=item.start) {
      form.elements.end.setCustomValidity('La fine deve essere successiva all’inizio.');
      form.elements.end.reportValidity();
      return;
    }
  }
  const previous = entries.find(entry=>entry.id===editingId);
  item.id = previous?.id || globalThis.crypto?.randomUUID?.() || Date.now()+'-'+Math.random().toString(36).slice(2);
  item.done = previous?.done ?? false;
  if(page==='calendar' && item.date) {
    selected = item.date;
    month = dateFromKey(selected);
  }
  dialog.close();
  save(previous ? entries.map(entry=>entry.id===item.id?item:entry) : [...entries,item]);
});
document.addEventListener('click',event=>{
  const button = event.target.closest('button');
  if(!button) return;
  const action = button.dataset;
  if(action.page) {
    page = action.page;
    render();
    nav.querySelector('[aria-current]').focus();
  } else if(action.add) {
    editingId = null;
    const defaults = {task:'task',exam:'exam',calendar:'event',lesson:'lesson',home:'task'};
    editor(action.add==='default'?defaults[page]:action.add,{},action.add==='default');
    dialog.showModal();
  } else if(action.edit) {
    const item = entries.find(entry=>entry.id===action.edit);
    editingId = item.id;
    editor(item.type,item);
    dialog.showModal();
  } else if(action.delete) {
    const item = entries.find(entry=>entry.id===action.delete);
    if(confirm('Eliminare “'+item.title+'”?')) save(entries.filter(entry=>entry.id!==item.id));
  } else if(action.toggle) {
    save(entries.map(item=>item.id===action.toggle?{...item,done:!item.done}:item));
    view.querySelector('[data-toggle="'+CSS.escape(action.toggle)+'"]')?.focus();
  } else if(action.month) {
    month = new Date(month.getFullYear(),month.getMonth()+Number(action.month),1);
    selected = dateKey(month);
    renderCalendar();
    view.querySelector('[data-month="'+action.month+'"]').focus();
  } else if(action.date) {
    selected = action.date;
    renderCalendar();
    view.querySelector('[aria-pressed=true]').focus();
  } else if('close' in action) {
    dialog.close();
  }
});
render();
</script>
</body>
</html>
